[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pectin-extraction"
version = "0.1.0"
description = "Hybrid mechanistic and ML optimization system for pectin extraction"
requires-python = ">=3.9"
dependencies = [
    "numpy<2",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pymc>=5.12.0",
    "pytensor>=2.19.0",
    "emcee>=3.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pectin"]

