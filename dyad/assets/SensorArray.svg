<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="sensorBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="opticsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Flow Cell / Flow-Through Manifold -->
  <rect x="20" y="44" width="80" height="32" rx="6" fill="#F1F5F9" stroke="#334155" stroke-width="3"/>
  <rect x="36" y="52" width="48" height="16" rx="2" fill="#E2E8F0"/>

  <!-- Optical Flow Cell Beam Path (NIR + UV A284) -->
  <line x1="24" y1="60" x2="96" y2="60" stroke="url(#opticsGrad)" stroke-width="3.5" stroke-dasharray="2,2"/>

  <!-- Sensor Transmitters -->
  <!-- 1. UV-Vis / NIR Optode Top -->
  <rect x="42" y="16" width="14" height="28" rx="2" fill="url(#sensorBodyGrad)" stroke="#475569" stroke-width="1.5"/>
  <circle cx="49" cy="22" r="2.5" fill="#8B5CF6"/>

  <!-- 2. Refractometer / Brix Probe Top -->
  <rect x="64" y="16" width="14" height="28" rx="2" fill="url(#sensorBodyGrad)" stroke="#475569" stroke-width="1.5"/>
  <circle cx="71" cy="22" r="2.5" fill="#10B981"/>

  <!-- Inlet & Outlet Flanges -->
  <path d="M 12 60 L 20 60" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <path d="M 100 60 L 108 60" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

  <!-- Signal Telemetry Waves (Soft Sensor output) -->
  <path d="M 45 92 Q 60 82 75 92 T 105 92" fill="none" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Connection Ports -->
  <circle cx="10" cy="60" r="3" fill="#F4A261" stroke="#FFFFFF" stroke-width="1.5"/> <!-- Sample In -->
  <circle cx="110" cy="60" r="3" fill="#6366F1" stroke="#FFFFFF" stroke-width="1.5"/> <!-- Signal Out -->
</svg>
