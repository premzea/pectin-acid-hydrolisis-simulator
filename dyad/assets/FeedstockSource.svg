<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="hopperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#588157"/>
      <stop offset="100%" stop-color="#3A5A40"/>
    </linearGradient>
    <linearGradient id="rindGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DDA15E"/>
      <stop offset="100%" stop-color="#BC6C25"/>
    </linearGradient>
  </defs>

  <!-- Hopper Body -->
  <polygon points="25,25 95,25 72,75 48,75" fill="url(#hopperGrad)" stroke="#344E41" stroke-width="3"/>
  <rect x="22" y="20" width="76" height="8" rx="2" fill="#344E41"/>

  <!-- Biomass Particles inside Hopper -->
  <ellipse cx="60" cy="38" rx="26" ry="6" fill="url(#rindGrad)"/>
  <circle cx="50" cy="50" r="4.5" fill="#FEFAE0" opacity="0.8"/>
  <circle cx="65" cy="52" r="5" fill="#DDA15E"/>
  <circle cx="58" cy="62" r="4" fill="#BC6C25"/>

  <!-- Screw Feeder / Rotary Valve -->
  <rect x="46" y="75" width="28" height="18" fill="#344E41" rx="2"/>
  <circle cx="60" cy="84" r="6" fill="#A3B18A"/>
  <line x1="60" y1="78" x2="60" y2="90" stroke="#344E41" stroke-width="2"/>
  <line x1="54" y1="84" x2="66" y2="84" stroke="#344E41" stroke-width="2"/>

  <!-- Feed Chute -->
  <path d="M 52 93 L 52 108 L 68 108 L 68 93" fill="none" stroke="#344E41" stroke-width="3"/>

  <!-- Outlet Port -->
  <circle cx="60" cy="110" r="3" fill="#06D6A0" stroke="#FFFFFF" stroke-width="1.5"/>
</svg>
