<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="columnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A86FF"/>
      <stop offset="100%" stop-color="#023E8A"/>
    </linearGradient>
  </defs>

  <!-- Separation Column / Fractionator Vessel -->
  <rect x="35" y="20" width="50" height="80" rx="8" fill="#F8F9FA" stroke="url(#columnGrad)" stroke-width="3"/>

  <!-- Fraction Bands -->
  <!-- 1. High-MW Intact Soluble Pectin (Top fraction) -->
  <rect x="38" y="30" width="44" height="18" rx="2" fill="#06D6A0" opacity="0.85"/>
  <text x="60" y="43" fill="#FFFFFF" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">P_sol</text>

  <!-- 2. Low-MW Pectin Oligomers (Middle fraction) -->
  <rect x="38" y="52" width="44" height="18" rx="2" fill="#FFD166" opacity="0.9"/>
  <text x="60" y="65" fill="#1D3557" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">P_lowMW</text>

  <!-- 3. Degradation Losses (Bottom fraction) -->
  <rect x="38" y="74" width="44" height="18" rx="2" fill="#E63946" opacity="0.85"/>
  <text x="60" y="87" fill="#FFFFFF" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">P_loss</text>

  <!-- Infeed from Reactor -->
  <path d="M 16 35 L 35 35" stroke="#023E8A" stroke-width="3" stroke-linecap="round"/>
  <!-- Outflow streams -->
  <path d="M 85 39 L 104 39" stroke="#06D6A0" stroke-width="3" stroke-linecap="round"/>
  <path d="M 85 61 L 104 61" stroke="#FFD166" stroke-width="3" stroke-linecap="round"/>
  <path d="M 85 83 L 104 83" stroke="#E63946" stroke-width="3" stroke-linecap="round"/>

  <!-- Connection Port Markers -->
  <circle cx="14" cy="35" r="3" fill="#F4A261" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="106" cy="39" r="3" fill="#06D6A0" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="106" cy="61" r="3" fill="#FFD166" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="106" cy="83" r="3" fill="#E63946" stroke="#FFFFFF" stroke-width="1.5"/>
</svg>
