<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="vesselGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2B4C7E"/>
      <stop offset="30%" stop-color="#4A7BB0"/>
      <stop offset="70%" stop-color="#3A6B9F"/>
      <stop offset="100%" stop-color="#1D3557"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F4A261" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#D62828"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Thermal Jacket -->
  <path d="M 22 42 L 22 84 C 22 104 98 104 98 84 L 98 42" 
        fill="none" stroke="url(#jacketGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Jacket In/Out Nozzles -->
  <line x1="14" y1="48" x2="22" y2="48" stroke="#E63946" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="14" y1="78" x2="22" y2="78" stroke="#E63946" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Main Vessel Body -->
  <path d="M 28 32 L 28 82 C 28 100 92 100 92 82 L 92 32 C 92 24 28 24 28 32 Z" 
        fill="#FFFFFF" stroke="url(#vesselGrad)" stroke-width="3.5" filter="url(#shadow)"/>

  <!-- Reaction Liquid Bulk -->
  <path d="M 31 52 Q 60 49 89 52 L 89 81 C 89 96 31 96 31 81 Z" 
        fill="url(#liquidGrad)"/>

  <!-- Top Head & Motor Mount -->
  <rect x="52" y="10" width="16" height="14" rx="2" fill="#457B9D" stroke="#1D3557" stroke-width="2"/>
  <rect x="56" y="6" width="8" height="4" rx="1" fill="#1D3557"/>

  <!-- Impeller Shaft -->
  <line x1="60" y1="24" x2="60" y2="82" stroke="#1D3557" stroke-width="2.5"/>

  <!-- Rushton Impeller Blades -->
  <line x1="44" y1="74" x2="76" y2="74" stroke="#1D3557" stroke-width="3" stroke-linecap="round"/>
  <rect x="42" y="70" width="4" height="8" rx="1" fill="#1D3557"/>
  <rect x="74" y="70" width="4" height="8" rx="1" fill="#1D3557"/>

  <!-- Top Infeed Nozzles -->
  <path d="M 36 26 L 36 18" stroke="#457B9D" stroke-width="3" stroke-linecap="round"/>
  <path d="M 84 26 L 84 18" stroke="#457B9D" stroke-width="3" stroke-linecap="round"/>

  <!-- Bottom Drain Nozzle -->
  <path d="M 60 96 L 60 108" stroke="#457B9D" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Port Circles for Dyad Schematic Connectivity -->
  <circle cx="36" cy="16" r="3" fill="#06D6A0" stroke="#FFFFFF" stroke-width="1.5"/> <!-- Feed port -->
  <circle cx="84" cy="16" r="3" fill="#118AB2" stroke="#FFFFFF" stroke-width="1.5"/> <!-- Acid port -->
  <circle cx="12" cy="48" r="3" fill="#E63946" stroke="#FFFFFF" stroke-width="1.5"/> <!-- Jacket In -->
  <circle cx="12" cy="78" r="3" fill="#E63946" stroke="#FFFFFF" stroke-width="1.5"/> <!-- Jacket Out -->
  <circle cx="60" cy="110" r="3" fill="#F4A261" stroke="#FFFFFF" stroke-width="1.5"/> <!-- Slurry Outlet -->
</svg>
