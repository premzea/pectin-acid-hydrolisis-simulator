<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="circulatorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E76F51"/>
      <stop offset="100%" stop-color="#9A031E"/>
    </linearGradient>
  </defs>

  <!-- Thermostatic Bath Unit Body -->
  <rect x="25" y="30" width="70" height="60" rx="8" fill="url(#circulatorGrad)" stroke="#5F0F40" stroke-width="3"/>

  <!-- Digital Display Screen -->
  <rect x="36" y="42" width="48" height="22" rx="3" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="58" fill="#F8FAFC" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">80.0°C</text>

  <!-- Thermal Indicator Wave -->
  <path d="M 40 76 Q 50 70 60 76 T 80 76" fill="none" stroke="#FB8500" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Fluid Supply / Return Ports -->
  <path d="M 38 30 L 38 16" stroke="#9A031E" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 82 30 L 82 16" stroke="#E76F51" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Connection Port Markers -->
  <circle cx="38" cy="14" r="3" fill="#E63946" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="82" cy="14" r="3" fill="#E63946" stroke="#FFFFFF" stroke-width="1.5"/>
</svg>
